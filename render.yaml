services:
  - type: web
    name: disastershield-ai-firetv
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn firetv_server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_LIVE_WEATHER
        value: "true"
      - key: DEFAULT_LOCATION_NAME
        value: "Prayagraj, Uttar Pradesh"
      - key: GEMMA_ENDPOINT_URL
        value: "http://localhost:11434"
      - key: GEMMA_MODEL_NAME
        value: "gemma4:e2b"
